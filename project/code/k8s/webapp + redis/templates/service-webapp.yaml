apiVersion: v1
kind: Service
metadata:
  name: {{ include "wholeapp-chart.name" . }}-web
  labels:
    {{ include "wholeapp-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
      protocol: TCP
      name: web
  selector:
    {{ include "wholeapp-chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
