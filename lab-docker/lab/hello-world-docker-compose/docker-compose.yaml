services:
  redis:
    image: "redis:alpine" # Alpine is smaller and faster
    ports:
      - "6379:6379"
    volumes:
      - ./db:/data/db

  web:
    build: .
    ports:
      - "8080:8080" # Changed 8080 to 1234 to match your environment variable
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - PORT=1234
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - redis # Ensures redis starts before the web app
    command: npm start