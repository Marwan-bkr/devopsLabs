name: Node.js CI with Redis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Set default working directory for all steps
    defaults:
      run:
        working-directory: 'lab-nodejs-redis-cicd'  # Change this to your actual folder
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'lab-nodejs-redis-cicd/package-lock.json'  # Change this
    
    - name: Install dependencies
      working-directory: ./lab-nodejs-redis-cicd
      run: npm ci
    
    - name: Run build
      working-directory: ./lab-nodejs-redis-cicd
      run: npm run build --if-present
    
    - name: Run tests
      working-directory: ./lab-nodejs-redis-cicd
      run: npm test
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379